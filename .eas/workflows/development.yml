name: Development build

# Linked GitHub repo: github.com/dev-zohaibalishah/tellatale-dorahacks
# Android first: this Windows machine cannot compile iOS, and a device iOS
# build also needs a paid Apple Developer account. Run iOS later from the
# Expo dashboard once those credentials exist.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build_android:
    name: Android development client
    type: build
    params:
      platform: android
      profile: development
